<body><div id="game"><canvas id="scene"></canvas></div><div class="grain"></div>
<div id="topbar"><div class="brand"><div class="brand-mark">✦</div><div class="brand-name">GRAND CITY LIFE<small>3D · CAMPINA GRANDE</small></div></div><div class="stats"><div class="pill health"><label>Saúde <span id="healthNum">100</span></label><div class="bar"><i id="healthBar"></i></div></div><div class="pill"><label>Grana</label><strong id="cash">$500</strong></div><div class="pill"><label>Respeito</label><strong id="respect">LV. 1</strong></div><div class="pill"><label>Procurado</label><strong class="stars" id="wanted">☆☆☆☆☆</strong></div></div><div class="right-top"><button class="icon-btn" id="mapBtn" title="Mapa">⌖</button><button class="icon-btn" id="menuBtn" title="Menu">☰</button></div></div>
<div id="location">CENTRO · CAMPINA GRANDE <span style="color:#a7b3a9;font:700 9px 'DM Sans';letter-spacing:0">&nbsp; STAMINA</span><i style="display:inline-block;vertical-align:middle;margin-left:5px;width:50px;height:4px;background:#455047;border-radius:4px;overflow:hidden"><i id="staminaBar" style="display:block;width:100%;height:100%;background:#c8f169"></i></i></div><div class="mission-card"><div class="eyebrow">Missão atual <span id="missionNo">01</span></div><div class="mission-title" id="missionTitle">Primeiro rolê</div><div class="mission-desc" id="missionDesc">Encontre um carro e dê uma volta pela cidade.</div><div class="mission-progress"><i id="missionBar"></i></div></div>
<div id="mapbox"><canvas id="map"></canvas></div><div class="maplabel">MAPA DA CIDADE</div><div id="prompt" class="prompt"><b>E</b> · <span id="promptText">Entrar no carro</span></div><div id="toast"></div>

<script>
(()=>{'use strict';
const canvas=document.querySelector('#scene'),ctx=canvas.getContext('2d'),mapCanvas=document.querySelector('#map'),mctx=mapCanvas.getContext('2d');
const $=s=>document.querySelector(s),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rand=(a,b)=>a+Math.random()*(b-a);
let W=0,H=0,dpr=1,last=0,toastTimer,keys={},day=0.25,weather=0,radio=0,modalTab='',autoSaveAt=20;
const state={x:0,y:0,angle:0,hp:100,stamina:100,money:500,respect:1,wanted:0,vehicle:null,carHealth:100,ammo:30,weapon:'Pistola',mission:0,progress:0,coins:0,owned:[],house:false,clothes:'Street',time:0,arrest:0,shotCooldown:0};
const zoneDefs=[{name:'CENTRO',x:0,y:0,color:'#e6b959',sky:'#8ea17c'},{name:'FAVELA',x:-800,y:-80,color:'#e58c58',sky:'#b58667'},{name:'PRAIA',x:850,y:60,color:'#43c5c6',sky:'#66b6ba'},{name:'BAIRRO RICO',x:0,y:-800,color:'#acb4d7',sky:'#8b9b9c'},{name:'ZONA INDUSTRIAL',x:0,y:800,color:'#ad7959',sky:'#8d8875'}];
const missions=[['Primeiro rolê','Encontre um carro e dê uma volta pela cidade.','Entre em qualquer veículo'],['Dia de táxi','Faça três corridas de táxi.','Interaja com o ponto de táxi'],['Pizza express','Faça uma entrega antes que o tempo acabe.','Pegue uma moto e vá à pizzaria'],['Primeira treta','Mostre quem manda no bairro.','Treine seus golpes'],['Assalto ao banco','Pegue o dinheiro e suma do mapa.','Chegue ao banco no Centro'],['Racha no Centro','Vença o racha pelas ruas do Centro.','Encontre o rival na avenida'],['Salve o parceiro','Ajude um amigo na Favela.','Vá até a Favela'],['Fuga da polícia','Despiste a polícia e zere o alerta.','Fique fora de vista'],['Festa na praia','Encontre a galera na orla.','Vá para Praia'],['Carro dos sonhos','Ache um esportivo pela cidade.','Entre em um esportivo'],['Guerra de bairro','Defenda seu território.','Afaste os encrenqueiros'],['Fuga aérea','Escape do helicóptero.','Despiste a polícia'],['Grande golpe','A joalheria está aberta.','Chegue à loja no Centro'],['Chefe final','Acabe com a máfia industrial.','Vá para Zona Industrial'],['Mundo aberto','Agora a cidade é sua. Explore sem limites.','Explore Campina Grande'],['Pacote escondido','Encontre um pacote secreto.','Procure nos bairros'],['Colecionador','Junte 50 moedas pela cidade.','Colete moedas'],['Carro secreto','Encontre um carro raro.','Explore a cidade'],['Lenda urbana','Complete um grande trabalho.','Faça qualquer atividade'],['Rei da cidade','Vire uma lenda de Campina.','Ganhe respeito']];
const cars=[['Pop 100',0,'#e7bd53',120],['Esportivo',850,'#dc6658',210],['Viatura',0,'#e8e8d8',185],['Táxi',0,'#f2c64f',145],['Ônibus',0,'#568dca',85],['Caminhão',0,'#b77356',95],['Lowrider',620,'#a678cf',120],['SUV',440,'#6d9877',145],['Street 1',0,'#d26955',155],['Street 2',0,'#7ca9c8',160],['Hatch',0,'#e18b54',130],['Sedan',300,'#82917b',145],['Van',0,'#d0ba9a',110],['Cupê',700,'#54a796',185],['Picape',380,'#bc7959',120],['Moto 1',0,'#df5f4e',230],['Moto 2',0,'#e9c24c',245],['Moto 3',0,'#67a6bf',205],['Moto 4',0,'#8885bb',220],['Moto 5',0,'#d7e1d8',235]];
const buildings=[];for(let i=0;i<80;i++){const gx=Math.floor(rand(-14,15)),gy=Math.floor(rand(-14,15)); if(Math.abs(gx%4)===0||Math.abs(gy%4)===0)continue;buildings.push({x:gx*200+rand(-20,20),y:gy*200+rand(-20,20),w:rand(80,145),h:rand(70,140),height:rand(38,150),color:['#d8a56d','#bd795d','#e2c99a','#849c83','#cb8666','#a5a58a'][Math.floor(rand(0,6))],seed:rand(0,1)});}
const entities=[];for(let i=0;i<32;i++)entities.push({type:Math.random()<.36?'car':'ped',x:rand(-1450,1450),y:rand(-1450,1450),angle:rand(0,Math.PI*2),color:['#d65d4d','#e7c34e','#69a4c4','#d8ddd2','#829777'][i%5],speed:rand(20,50),phase:rand(0,8)});
const police=[];const missionMarkers=[{x:0,y:0,label:'BANCO'},{x:-800,y:-80,label:'FAVELA'},{x:850,y:60,label:'PRAIA'},{x:0,y:-800,label:'RACHA'},{x:0,y:800,label:'CHEFE'}];
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=canvas.clientWidth;H=canvas.clientHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);mapCanvas.width=mapCanvas.clientWidth*dpr;mapCanvas.height=mapCanvas.clientHeight*dpr;mctx.setTransform(dpr,0,0,dpr,0,0)}window.addEventListener('resize',resize);resize();
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2100)}
function zone(){let nearest=zoneDefs[0];for(const z of zoneDefs)if(Math.hypot(state.x-z.x,state.y-z.y)<Math.hypot(state.x-nearest.x,state.y-nearest.y))nearest=z;return nearest}
function save(){try{localStorage.setItem('gcl3-save',JSON.stringify(state));toast('Jogo salvo com sucesso')}catch{}}
function load(){try{const d=JSON.parse(localStorage.getItem('gcl3-save'));if(d)Object.assign(state,d)}catch{}}
load();
function screen(x,y,z=0){const s=0.8;return [W/2+(x-state.x)*s,H*.53+(y-state.y)*s-z]}
function poly(points,fill,stroke){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke()}}
function rectWorld(x,y,w,h,fill){const [sx,sy]=screen(x,y);ctx.fillStyle=fill;ctx.fillRect(sx,sy,w*.8,h*.8)}
function drawGround(){ctx.fillStyle='#80936f';ctx.fillRect(0,0,W,H);const unit=200, left=state.x-W/1.6-400,top=state.y-H/1.6-400;for(let gx=Math.floor(left/unit);gx<Math.ceil((state.x+W/1.6+400)/unit);gx++)for(let gy=Math.floor(top/unit);gy<Math.ceil((state.y+H/1.6+400)/unit);gy++){let x=gx*unit,y=gy*unit;const px=screen(x,y),size=unit*.8;if(Math.abs(gx%4)===0){ctx.fillStyle='#626c61';ctx.fillRect(px[0]-size/2,px[1]-size/2,size,size);ctx.fillStyle='#444e48';ctx.fillRect(px[0]-size/2,px[1]-size/2,size,size);ctx.fillStyle='#e2d4a0';ctx.fillRect(px[0]-2,px[1]-size/2,4,size);for(let n=-2;n<3;n++)ctx.fillRect(px[0]-size/2,px[1]+n*23,size,2)}else if(Math.abs(gy%4)===0){ctx.fillStyle='#444e48';ctx.fillRect(px[0]-size/2,px[1]-size/2,size,size);ctx.fillStyle='#e2d4a0';ctx.fillRect(px[0]-size/2,px[1]-2,size,4);for(let n=-2;n<3;n++)ctx.fillRect(px[0]+n*23,px[1]-size/2,2,size)}else{ctx.fillStyle='#8c9c78';ctx.fillRect(px[0]-size/2,px[1]-size/2,size,size);ctx.fillStyle='#9eaa83';ctx.fillRect(px[0]-size/2+6,px[1]-size/2+6,size-12,size-12);}}}
function drawBuildings(){for(const b of buildings){if(Math.abs(b.x-state.x)>W/1.5+230||Math.abs(b.y-state.y)>H/1.5+230)continue;const [x,y]=screen(b.x,b.y);const w=b.w*.8,h=b.h*.8,z=b.height*.8;ctx.fillStyle='#0003';ctx.fillRect(x-w/2+8,y-h/2+10,w,h);ctx.fillStyle='#7d6956';ctx.fillRect(x-w/2,y-h/2-z+9,w,h);ctx.fillStyle=b.color;ctx.fillRect(x-w/2,y-h/2-z,w,h);ctx.fillStyle='#ffffff35';ctx.fillRect(x-w/2,y-h/2-z,w,5);ctx.fillStyle='#fff4c4';for(let ix=0;ix<Math.floor(w/24);ix++)for(let iy=0;iy<Math.floor(h/24);iy++){ctx.fillRect(x-w/2+8+ix*24,y-h/2-z+12+iy*24,7,9)}ctx.fillStyle='#685c4d';ctx.fillRect(x-7,y+h/2-z-18,14,18);}}
function drawEnvironment(){const z=zone();let t=(Math.sin(day*Math.PI*2)+1)/2;ctx.fillStyle=`rgba(18,25,45,${.35*(1-t)})`;ctx.fillRect(0,0,W,H);if(z.name==='PRAIA'){ctx.fillStyle='#43c4c6';ctx.fillRect(0,H*.77,W,H*.23);ctx.fillStyle='#e7d49c';ctx.fillRect(0,H*.72,W,H*.055)}if(z.name==='CENTRO'){const [x,y]=screen(0,0);ctx.fillStyle='#77a879';ctx.beginPath();ctx.ellipse(x,y,95,54,0,0,Math.PI*2);ctx.fill();for(let i=0;i<8;i++){let a=i*Math.PI/4;ctx.fillStyle='#47774e';ctx.beginPath();ctx.arc(x+Math.cos(a)*57,y+Math.sin(a)*31,10,0,7);ctx.fill()}}}
function drawCar(x,y,a,color,type='car',player=false){const [sx,sy]=screen(x,y);ctx.save();ctx.translate(sx,sy);ctx.rotate(a);let w=type==='bus'?42:type==='moto'?23:34,h=type==='bus'?20:type==='moto'?10:17;ctx.fillStyle='#0006';ctx.fillRect(-w/2+3,-h/2+5,w,h);ctx.fillStyle='#222b29';ctx.fillRect(-w/2,-h/2,w,h);ctx.fillStyle=color;ctx.fillRect(-w/2+2,-h/2+2,w-4,h-4);ctx.fillStyle='#b8d5d4';ctx.fillRect(-w*.1,-h/2+3,w*.42,h-6);ctx.fillStyle='#f8eab9';ctx.fillRect(w/2-5,-h/2+3,4,3);ctx.fillRect(w/2-5,h/2-6,4,3);ctx.fillStyle='#141917';ctx.fillRect(-w*.32,-h/2-2,7,3);ctx.fillRect(w*.18,-h/2-2,7,3);ctx.fillRect(-w*.32,h/2-1,7,3);ctx.fillRect(w*.18,h/2-1,7,3);if(player){ctx.strokeStyle='#c8f169';ctx.lineWidth=2;ctx.strokeRect(-w/2-3,-h/2-3,w+6,h+6)}ctx.restore()}
function drawPed(x,y,color,player=false){const [sx,sy]=screen(x,y);ctx.fillStyle='#0004';ctx.beginPath();ctx.ellipse(sx,sy+5,7,4,0,0,7);ctx.fill();ctx.fillStyle=player?'#293847':color;ctx.fillRect(sx-5,sy-13,10,15);ctx.fillStyle=player?'#e1b58b':'#d7a982';ctx.beginPath();ctx.arc(sx,sy-16,5,0,7);ctx.fill();if(player){ctx.fillStyle='#c8f169';ctx.fillRect(sx-6,sy-22,12,4);ctx.fillRect(sx-5,sy-25,10,4)}}

function buy(what,cost){if(what==='house'&&state.house){toast('Você já tem uma casa');return}if(state.money<cost){toast('Grana insuficiente para essa compra');return}state.money-=cost;if(what==='health'){state.hp=100;toast('Saúde restaurada!')}if(what==='ammo'){state.ammo+=30;toast('Munição comprada')}if(what==='shotgun'){state.weapon='Escopeta';state.ammo+=25;toast('Escopeta comprada!')}if(what==='house'){state.house=true;toast('Casa comprada! Agora você tem um lugar seguro')}if(what==='clothes'){state.clothes='Hoodie novo';state.respect++;toast('Visual renovado! +1 respeito')}updateUI();renderModal('shop');save()}

function openModal(tab='menu'){if(tab==='jobs'){renderJobs();$('#overlay').style.display='flex';return}$('#overlay').style.display='flex';renderModal(tab)}function renderJobs(){$('#modalTitle').textContent='TRABALHOS & ATIVIDADES';$('#modalBody').innerHTML='<div class="tabs"><button class="tab active">BICOS DA CIDADE</button></div><div class="content">'+[['Táxi Driver','Faça 3 corridas pelo Centro.','$90 por passageiro'],['Delivery Boy','Entregue pizza de moto antes do tempo.','$180 por entrega'],['Mecânico','Conserte seu veículo e ganhe respeito.','$120 por serviço'],['Street Racer','Desafie rivais no asfalto.','$350 pela vitória'],['Trabalho livre','Ajude nas ruas para ganhar uma grana.','$80 de bônus'],['Descansar','Vá para o hospital e recupere a saúde.','Grátis']].map((j,i)=>`<div class="row"><div><h3>${j[0]}</h3><p>${j[1]} · ${j[2]}</p></div><button class="buy" data-job="${i}">ACEITAR</button></div>`).join('')+'</div>';document.querySelectorAll('[data-job]').forEach(b=>b.onclick=()=>{const i=+b.dataset.job;if(i===5){state.hp=100;state.wanted=0;toast('Você acordou no hospital, 100% de saúde')}else{const reward=[270,180,120,350,80][i];state.money+=reward;state.respect++;if(i===0&&state.mission===1){state.progress+=3;finishMission()}else if(i===1&&state.mission===2)finishMission();else if(i===3&&state.mission===5)finishMission();else toast('Trabalho concluído! +$'+reward)}updateUI();save();closeModal()})}
function handleKey(e){const k=e.key.toLowerCase();if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault();keys[e.key]=e.type==='keydown';if(e.type==='keydown'){if(k==='e')act('interact');if(k==='f')act('punch');if(k==='g')act('shoot');if(k==='h')act('horn');if(k==='r')act('radio');if(k==='escape'){if($('#overlay').style.display==='flex')closeModal();else openModal('menu')}if(k==='m')openModal('map');if(k===' '&&!e.repeat)act('jump');if(k==='shift')keys.ShiftLeft=true}}window.addEventListener('keydown',handleKey);window.addEventListener('keyup',handleKey);
let stickX=0,stickY=0;const stick=$('#stick');if(stick){let pointer=null;stick.addEventListener('pointerdown',e=>{pointer=e.pointerId;stick.setPointerCapture(pointer);stick.classList.add('on');moveStick(e)});stick.addEventListener('pointermove',e=>{if(pointer===e.pointerId)moveStick(e)});const end=()=>{pointer=null;stickX=stickY=0;stick.classList.remove('on')};stick.addEventListener('pointerup',end);stick.addEventListener('pointercancel',end)}function moveStick(e){const r=stick.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),len=Math.hypot(dx,dy),max=44;stickX=clamp(dx/max,-1,1);stickY=clamp(dy/max,-1,1);stick.style.setProperty('--dx',(dx*(Math.min(1,max/Math.max(len,1))))+'px');stick.style.setProperty('--dy',(dy*(Math.min(1,max/Math.max(len,1))))+'px');stick.style.setProperty('--dot','');stick.style.backgroundColor='#dce8df20';stick.style.setProperty('background-image',`radial-gradient(circle at ${50+stickX*34}% ${50+stickY*34}%, #c8f169 0 18px, transparent 19px)`)}

.progress===1)finishMission();if(state.mission===2&&state.time%32<dt){toast('Tempo da entrega está acabando!')}if(state.time>autoSaveAt){try{localStorage.setItem('gcl3-save',JSON.stringify(state))}catch{}autoSaveAt=state.time+20}drawWorld();drawMap();updateUI();requestAnimationFrame(tick)}requestAnimationFrame(tick);
